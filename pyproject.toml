[project]
name = "peeklet"
version = "0.1.0"
description = "Smart screenshot change detection — filters noise, redacts PII, exports structured keyframe manifests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Vidya", email = "vidya@peeklet.dev" },
]
keywords = ["screenshot", "change-detection", "deduplication", "parquet", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-image>=0.21",
    "imagehash>=4.3",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7",
    "pymupdf>=1.23",
]
video = [
    "imageio[ffmpeg]>=2.31",
    "av>=14.0",
    "pydub>=0.25",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
datasets = [
    "datasets>=2.14",
    "huggingface-hub>=0.17",
]

[project.scripts]
peeklet = "peeklet.cli:main"

[project.urls]
Homepage = "https://github.com/SrividyaKirti/Peeklet"
Repository = "https://github.com/SrividyaKirti/Peeklet"
Issues = "https://github.com/SrividyaKirti/Peeklet/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peeklet"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "imagehash.*",
    "skimage.*",
    "av.*",
    "imageio.*",
    "imageio_ffmpeg.*",
    "pydub.*",
    "easyocr.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "datasets: tests requiring downloaded datasets (deselect with '-m not datasets')",
    "mind2web: tests requiring Mind2Web dataset (deselect with '-m not mind2web')",
    "showui: tests requiring ShowUI dataset (deselect with '-m not showui')",
    "webui: tests requiring WebUI dataset (deselect with '-m not webui')",
    "benchmark: performance benchmark tests",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
