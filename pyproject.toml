[project]
name = "peeklet"
version = "0.2.0"
description = "Annotate screen-recording transcripts with the screenshots they refer to, for LLMs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Vidya", email = "vidya@peeklet.dev" },
]
keywords = ["screen-recording", "transcript", "screenshots", "llm", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=10.1",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "imagehash>=4.3",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "imageio[ffmpeg]>=2.31",
    "av>=14.0",
    "pydub>=0.25",
    "pytesseract>=0.3.10",
    "anthropic>=0.40",
    "openai>=1.0",
    "audioop-lts; python_version >= \"3.13\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
peeklet = "peeklet.cli:main"

[project.urls]
Homepage = "https://github.com/SrividyaKirti/Peeklet"
Repository = "https://github.com/SrividyaKirti/Peeklet"
Issues = "https://github.com/SrividyaKirti/Peeklet/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peeklet"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "imagehash.*",
    "skimage.*",
    "av.*",
    "imageio.*",
    "imageio_ffmpeg.*",
    "pydub.*",
    "pytesseract.*",
    "openai.*",
    "anthropic.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "benchmark: performance benchmark tests",
    "slow: long-running integration tests (use -m slow to run)",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-pyyaml>=6.0.12.20250915",
]
