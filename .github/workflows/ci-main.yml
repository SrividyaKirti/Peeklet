name: CI — Main

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src/peeklet/ tests/
      - run: uv run ruff format --check src/peeklet/ tests/
      - run: uv run mypy src/peeklet/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (for pyav) and tesseract (for demo-mode OCR tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev tesseract-ocr
      - name: Install ffmpeg + tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --dev --python ${{ matrix.python-version }}
      - run: uv run pytest tests/unit/ --cov=src/peeklet --cov-fail-under=90 -v
      - run: uv run pytest tests/integration/ -v

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/benchmarks/ -v --benchmark-only || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --dev
      - run: uv pip audit || true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv build
      - run: |
          uv venv /tmp/smoke-test
          VIRTUAL_ENV=/tmp/smoke-test uv pip install dist/*.whl
          /tmp/smoke-test/bin/peeklet --version
