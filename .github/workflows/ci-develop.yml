name: CI — Develop

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src/peeklet/ tests/
      - run: uv run ruff format --check src/peeklet/ tests/
      - run: uv run mypy src/peeklet/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (for pyav) and tesseract (for demo-mode OCR tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev tesseract-ocr
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --dev
      - run: uv run pytest tests/unit/ --cov=src/peeklet --cov-fail-under=90 -v
      - run: uv run pytest tests/integration/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv build
